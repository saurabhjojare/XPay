services:
  postgres-loan:
    image: postgres:18.0-bookworm
    container_name: postgres-xpay-loan
    environment:
      POSTGRES_USER: saurabhjojare
      POSTGRES_PASSWORD: Saurabh@123
      POSTGRES_DB: xpay-db-loan
    ports:
      - "5436:5432"
    volumes:
      - postgres_loan_data:/var/lib/postgresql
    networks:
      - xpay-loan-net

volumes:
  postgres_loan_data:

networks:
  xpay-loan-net:
    driver: bridge
